version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - govet
    - ineffassign
    - intrange
    - misspell
    - nilerr
    - noctx
    - sloglint
    - staticcheck
    - unparam
    - unused
    - usestdlibvars
    - gosec
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    sloglint:
      kv-only: true
      static-msg: true
    depguard:
      rules:
        layer-domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: jarvis/server/internal/app
              desc: domain must not depend on app
            - pkg: jarvis/server/internal/source
              desc: domain must not depend on source
            - pkg: jarvis/server/internal/httpapi
              desc: domain must not depend on httpapi
            - pkg: jarvis/server/internal/platform
              desc: domain must not depend on platform
            - pkg: jarvis/server/internal/bootstrap
              desc: domain must not depend on bootstrap
        layer-app:
          files:
            - "**/internal/app/**"
          deny:
            - pkg: jarvis/server/internal/source
              desc: app must not depend on source
            - pkg: jarvis/server/internal/httpapi
              desc: app must not depend on httpapi
            - pkg: jarvis/server/internal/platform
              desc: app must not depend on platform
            - pkg: jarvis/server/internal/bootstrap
              desc: app must not depend on bootstrap
        layer-source:
          files:
            - "**/internal/source/**"
          deny:
            - pkg: jarvis/server/internal/app
              desc: source must not depend on app
            - pkg: jarvis/server/internal/httpapi
              desc: source must not depend on httpapi
            - pkg: jarvis/server/internal/bootstrap
              desc: source must not depend on bootstrap
        layer-httpapi:
          files:
            - "**/internal/httpapi/**"
          deny:
            - pkg: jarvis/server/internal/source
              desc: httpapi must not depend on source
            - pkg: jarvis/server/internal/bootstrap
              desc: httpapi must not depend on bootstrap
        layer-platform:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: jarvis/server/internal/domain
              desc: platform must not depend on domain
            - pkg: jarvis/server/internal/app
              desc: platform must not depend on app
            - pkg: jarvis/server/internal/source
              desc: platform must not depend on source
            - pkg: jarvis/server/internal/httpapi
              desc: platform must not depend on httpapi
            - pkg: jarvis/server/internal/bootstrap
              desc: platform must not depend on bootstrap
        feature-domain-availability:
          files:
            - "**/internal/domain/availability/**"
          deny:
            - pkg: jarvis/server/internal/domain/health
              desc: domain/availability must not import the feature health
            - pkg: jarvis/server/internal/domain/identity
              desc: domain/availability must not import the feature identity
            - pkg: jarvis/server/internal/domain/logs
