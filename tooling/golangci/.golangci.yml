version: "2"

run:
  timeout: 5m

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - exhaustive
    - gosec
    - intrange
    - misspell
    - nilerr
    - noctx
    - sloglint
    - unparam
    - usestdlibvars
    # Size and complexity.
    - funlen
    - gocognit
    - nestif
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    sloglint:
      kv-only: true
      static-msg: true
    funlen:
      lines: 60
      statements: 40
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofmt
