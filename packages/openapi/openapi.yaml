          examples:
            - "2026-10-30T10:00:00Z"
          format: date-time
          type: string
        stepSeconds:
          description: Width of a bucket.
          examples:
            - 120
          format: int64
          type: integer
      required:
        - start
        - end
        - stepSeconds
        - items
      type: object
    ZpoolBody:
      additionalProperties: false
      properties:
        latestSnapshotAt:
          description: Creation time of the newest snapshot of the pool or of a dataset below it, RFC 3339 in UTC. Absent without any.
          examples:
            - "2026-10-31T00:00:00Z"
          format: date-time
          type: string
        name:
          description: Pool name.
          examples:
            - hdd
          type: string
        state:
          description: ZFS pool state.
          enum:
            - online
            - degraded
            - faulted
            - offline
            - removed
            - suspended
            - unavail
            - unknown
          examples:
            - online
          type: string
      required:
        - name
        - state
      type: object
