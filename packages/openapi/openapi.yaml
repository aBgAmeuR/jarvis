              - "2026-10-31T10:00:00Z"
            format: date-time
            type: string
        - description: Alert state. Resolved alerts are rebuilt from Prometheus over the window, which the other states ignore.
          explode: false
          in: query
          name: state
          schema:
            default: firing
            description: Alert state. Resolved alerts are rebuilt from Prometheus over the window, which the other states ignore.
            enum:
              - firing
              - suppressed
              - resolved
            type: string
        - description: Only alerts of this severity.
          explode: false
          in: query
          name: severity
