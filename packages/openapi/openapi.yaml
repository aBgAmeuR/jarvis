components:
  schemas:
    AlertBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AlertBody.json
          format: uri
          readOnly: true
          type: string
        annotations:
          additionalProperties:
            type: string
          description: Alert annotations, with summary and description.
          examples:
            - summary: Guest 116 (dns) is not running
          type: object
        endsAt:
          description: When a resolved alert stopped firing, RFC 3339 in UTC.
          examples:
            - "2026-10-31T10:12:00Z"
          format: date-time
          type: string
        fingerprint:
          description: Alertmanager fingerprint, the alert id.
          examples:
            - 3a1f9c0d5b7e2a44
          type: string
        labels:
          additionalProperties:
            type: string
          description: Alert labels.
          examples:
            - severity: critical
              vmid: "116"
          type: object
        name:
          description: Alert rule name.
          examples:
            - GuestDown
          type: string
        severity:
          description: Severity label of the rule.
          enum:
            - critical
            - warning
            - info
            - none
          examples:
            - critical
          type: string
        startsAt:
          description: When the alert started firing, RFC 3339 in UTC. For a resolved alert that began before the window, its first sample in the window.
          examples:
            - "2026-10-31T09:41:00Z"
          format: date-time
          type: string
        state:
          description: firing, or suppressed when silenced or inhibited.
          enum:
            - firing
            - suppressed
            - resolved
          examples:
            - firing
          type: string
      required:
        - fingerprint
        - name
        - severity
        - state
        - startsAt
        - labels
        - annotations
      type: object
    AtaHealthBody:
      additionalProperties: false
      properties:
        pendingSectors:
          description: Sectors waiting to be reallocated.
          examples:
            - 0
          format: int64
          type: integer
        reallocatedSectors:
          description: Reallocated sectors.
          examples:
            - 0
          format: int64
          type: integer
        udmaCrcErrors:
          description: Interface CRC errors.
          examples:
            - 0
          format: int64
          type: integer
        uncorrectableSectors:
          description: Uncorrectable sectors found offline.
          examples:
            - 0
          format: int64
          type: integer
      required:
        - reallocatedSectors
        - pendingSectors
        - uncorrectableSectors
        - udmaCrcErrors
      type: object
    BackupBody:
      additionalProperties: false
      properties:
        backupCount:
          description: Backup files kept for the guest.
          examples:
            - 7
          format: int64
          type: integer
        covered:
          description: Whether a backup job covers the guest.
          examples:
            - true
          type: boolean
        lastBackupAt:
          description: When the newest backup file was written, RFC 3339 in UTC. Absent without any.
          examples:
            - "2026-10-31T03:00:00Z"
          format: date-time
          type: string
        lastBackupSizeBytes:
          description: Size of the newest backup file.
          examples:
            - 524288000
          format: int64
          minimum: 0
          type: integer
        lastResult:
          description: Result of the last backup run.
          enum:
            - ok
            - warning
            - error
            - unknown
          examples:
            - ok
          type: string
        lastRunAt:
          description: When the last backup run started, RFC 3339 in UTC. Absent without any.
          examples:
            - "2026-10-31T03:00:00Z"
          format: date-time
          type: string
        name:
          description: Guest name.
          examples:
            - dns
          type: string
        vmid:
          description: Proxmox guest id.
          examples:
            - 116
          format: int64
          type: integer
      required:
        - vmid
        - name
        - covered
        - backupCount
        - lastBackupSizeBytes
        - lastResult
      type: object
    BackupJobBody:
      additionalProperties: false
      properties:
        comment:
          description: Comment on the job.
          examples:
            - Nightly
          type: string
        enabled:
          description: Whether the job runs.
          examples:
            - true
          type: boolean
        id:
          description: Proxmox backup job id.
          examples:
            - backup-3f1a2b4c-0d5e
          type: string
        mode:
          description: Backup mode.
          examples:
            - snapshot
          type: string
        nextRunAt:
          description: Next run, RFC 3339 in UTC.
          examples:
            - "2026-11-01T03:00:00Z"
          format: date-time
          type: string
        schedule:
          description: When the job runs, as Proxmox writes it.
          examples:
            - "03:00"
          type: string
        storage:
          description: Where the backups go.
          examples:
            - local
          type: string
      required:
        - id
        - enabled
        - schedule
        - storage
        - mode
      type: object
    BucketBody:
      additionalProperties: false
      properties:
        availability:
          description: Share of successful probes that day, from 0 to 1. Absent without samples.
          examples:
            - 1
          format: double
          type: number
        start:
          description: First instant of the UTC day, RFC 3339.
          examples:
            - "2026-10-30T00:00:00Z"
          format: date-time
          type: string
      required:
        - start
      type: object
    CertificateBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CertificateBody.json
          format: uri
          readOnly: true
          type: string
        expiresAt:
          description: When the certificate expires, RFC 3339 in UTC.
          examples:
            - "2027-01-15T10:00:00Z"
          format: date-time
          type: string
        expiresInSeconds:
          description: Time left before it expires. Negative once expired.
          examples:
            - 7776000
          format: int64
          type: integer
        site:
          description: Site host name.
          examples:
            - files.antoinejosset.fr
          type: string
        target:
          description: URL probed.
          examples:
            - https://files.antoinejosset.fr/healthz
          type: string
        vmid:
          description: Guest behind the site.
          examples:
            - 115
          format: int64
          type: integer
      required:
        - site
        - target
        - expiresAt
        - expiresInSeconds
      type: object
    ClientBody:
      additionalProperties: false
      properties:
        blocked:
          description: Queries the resolver blocked over the last 24 hours.
          examples:
            - 87
          format: int64
          type: integer
        id:
          description: MAC address in lowercase, with hyphens.
          examples:
            - bc-07-1d-35-46-1f
          type: string
        ip:
          description: IP address of the DHCP lease.
          examples:
            - 192.168.1.22
          type: string
        lastQueryAt:
          description: Last time the device queried, to 5 minutes. Absent when it did not in the last 24 hours.
          examples:
            - "2026-10-31T18:25:00Z"
          format: date-time
          type: string
        leaseExpiresAt:
          description: When the DHCP lease expires, RFC 3339 in UTC.
          examples:
            - "2026-11-01T10:00:00Z"
          format: date-time
          type: string
        mac:
          description: MAC address.
          examples:
            - bc:07:1d:35:46:1f
          type: string
        name:
          description: Name the resolver found for the device. Absent when it has none.
          examples:
            - iPhone.lan
          type: string
        queries:
          description: DNS queries over the last 24 hours.
          examples:
            - 1250
          format: int64
          type: integer
      required:
        - id
        - mac
        - ip
        - leaseExpiresAt
        - queries
        - blocked
      type: object
    ClientDetailBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ClientDetailBody.json
          format: uri
          readOnly: true
          type: string
        blocked:
          description: Queries the resolver blocked over the last 24 hours.
          examples:
            - 87
          format: int64
          type: integer
        degraded:
          description: Sources that failed. The client is still returned.
          items:
            $ref: "#/components/schemas/DegradedBody"
          type: array
        id:
          description: MAC address in lowercase, with hyphens.
          examples:
            - bc-07-1d-35-46-1f
          type: string
        ip:
          description: IP address of the DHCP lease.
          examples:
            - 192.168.1.22
          type: string
        lastQueryAt:
          description: Last time the device queried, to 5 minutes. Absent when it did not in the last 24 hours.
          examples:
            - "2026-10-31T18:25:00Z"
          format: date-time
          type: string
        leaseExpiresAt:
          description: When the DHCP lease expires, RFC 3339 in UTC.
          examples:
            - "2026-11-01T10:00:00Z"
          format: date-time
          type: string
        mac:
          description: MAC address.
          examples:
            - bc:07:1d:35:46:1f
          type: string
        name:
          description: Name the resolver found for the device. Absent when it has none.
          examples:
            - iPhone.lan
          type: string
        queries:
          description: DNS queries over the last 24 hours.
          examples:
            - 1250
          format: int64
          type: integer
      required:
        - degraded
        - id
        - mac
        - ip
        - leaseExpiresAt
        - queries
        - blocked
      type: object
    DNSBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/DNSBody.json
          format: uri
          readOnly: true
          type: string
        blocked:
          description: Queries blocked over the last 24 hours.
          examples:
            - 2200
          format: int64
          type: integer
        cached:
          description: Queries answered from the cache over the last 24 hours.
          examples:
            - 35000
          format: int64
          type: integer
        queries:
          description: DNS queries over the last 24 hours.
          examples:
            - 52000
          format: int64
          type: integer
        queriesPerSecond:
          description: Queries per second over the last 5 minutes.
          examples:
            - 0.6
          format: double
          type: number
        upstreamLatencySeconds:
          description: Average time the upstream resolver took over the last 24 hours.
          examples:
            - 0.01
          format: double
          type: number
      required:
        - queries
        - blocked
        - cached
        - upstreamLatencySeconds
        - queriesPerSecond
      type: object
    DegradedBody:
      additionalProperties: false
      properties:
        reason:
          description: How it failed.
          examples:
            - Did not answer in time
          type: string
        source:
          description: Data source that failed.
          examples:
            - alertmanager
          type: string
      required:
        - source
        - reason
      type: object
    DiskBody:
      additionalProperties: false
      properties:
        ata:
          $ref: "#/components/schemas/AtaHealthBody"
          description: ATA health figures. Absent on other drives.
        device:
          description: Device path.
          examples:
            - /dev/sda
          type: string
        healthPassed:
          description: Result of the SMART overall health test.
          examples:
            - true
          type: boolean
        model:
          description: Drive model.
          examples:
            - WDC WD40EFPX-68C6CN0
          type: string
        nvme:
          $ref: "#/components/schemas/NvmeHealthBody"
          description: NVMe health figures. Absent on other drives.
        powerOnHours:
          description: Hours powered on. Absent when not reported.
          examples:
            - 7533
          format: int64
          type: integer
        protocol:
          description: Interface protocol.
          examples:
            - ATA
          type: string
        rotational:
          description: Whether the drive has spinning platters.
          examples:
            - true
          type: boolean
        serial:
          description: Serial number.
          examples:
            - WD-WX32D855YNY2
          type: string
        standby:
          description: Whether the drive is asleep.
          examples:
            - false
          type: boolean
        temperatureCelsius:
          description: Drive temperature. Absent when not reported.
          examples:
            - 26
          format: double
          type: number
      required:
        - device
        - model
        - serial
        - protocol
        - rotational
        - healthPassed
        - standby
      type: object
    DomainBody:
      additionalProperties: false
      properties:
        count:
          description: Lookups over the window.
          examples:
            - 18
          format: int64
          type: integer
        domain:
          description: Domain name, with its trailing dot.
          examples:
            - googleads.g.doubleclick.net.
          type: string
      required:
        - domain
        - count
      type: object
    DriftItemBody:
      additionalProperties: false
      properties:
        differences:
          description: The resources that differ. Only for resourceMismatch.
          items:
            $ref: "#/components/schemas/ResourceDifferenceBody"
          type: array
        kind:
          description: "What differs: a guest in Proxmox that homelab-iac does not manage, the reverse, or resources that differ between the two."
          enum:
            - missingInIac
            - missingInProxmox
            - resourceMismatch
          examples:
            - missingInIac
          type: string
        name:
          description: Guest name.
          examples:
            - remote-dev
          type: string
        vmid:
          description: Guest id.
          examples:
            - 105
          format: int64
          type: integer
      required:
        - kind
        - vmid
        - name
      type: object
    EntryBody:
      additionalProperties: false
      properties:
        instance:
          description: Guest name.
          examples:
            - dns
          type: string
        level:
          description: Journal priority. Absent when the stream has none.
          examples:
            - info
          type: string
        line:
          description: The log line.
          examples:
            - query resolved
          type: string
        service:
          description: Unit or container the line comes from.
          examples:
            - blocky
          type: string
        timestamp:
          description: When the line was written, RFC 3339 in UTC.
          examples:
            - "2026-10-31T18:23:58.123456789Z"
          format: date-time
          type: string
        vmid:
          description: Guest VMID. Absent when the stream has none.
          examples:
            - 116
          format: int64
          type: integer
      required:
        - timestamp
        - line
        - service
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GetProbeAvailabilityOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/GetProbeAvailabilityOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: The last 90 UTC days, then today so far, oldest first.
          items:
            $ref: "#/components/schemas/BucketBody"
          type: array
      required:
        - items
      type: object
    GuestBody:
      additionalProperties: false
      properties:
        address:
          description: IP address from the catalog.
          examples:
            - 192.168.1.116
          type: string
        alertCount:
          description: Number of firing alerts on the guest.
          examples:
            - 1
          format: int64
          type: integer
        alertSeverity:
          description: Severity of the worst firing alert on the guest. Absent when none fires.
          enum:
            - critical
            - warning
            - info
          examples:
            - warning
          type: string
        description:
          description: Description from the catalog.
          examples:
            - Blocky and dnsmasq
          type: string
        kind:
          description: Container or virtual machine.
          enum:
            - lxc
            - qemu
          examples:
            - lxc
          type: string
        managedByIac:
          description: Whether homelab-iac manages the guest. Absent when the catalog is unavailable.
          examples:
            - true
          type: boolean
        name:
          description: Guest name.
          examples:
            - dns
          type: string
        node:
          description: Proxmox node hosting the guest.
          examples:
            - pve
          type: string
        status:
          description: Proxmox status.
          examples:
            - running
          type: string
        upgrades:
          $ref: "#/components/schemas/UpgradesBody"
          description: Pending apt upgrades. Absent when the guest reports none.
        usage:
          $ref: "#/components/schemas/UsageBody"
          description: Resource usage. Absent unless the guest is running.
        vmid:
          description: Proxmox guest id.
          examples:
            - 116
          format: int64
          type: integer
      required:
        - vmid
        - name
        - kind
        - node
        - status
        - alertCount
      type: object
    GuestDetailBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/GuestDetailBody.json
          format: uri
          readOnly: true
          type: string
        address:
          description: IP address from the catalog.
          examples:
            - 192.168.1.116
          type: string
        alertCount:
          description: Number of firing alerts on the guest.
          examples:
            - 1
          format: int64
          type: integer
        alertSeverity:
          description: Severity of the worst firing alert on the guest. Absent when none fires.
          enum:
            - critical
            - warning
            - info
          examples:
            - warning
          type: string
        degraded:
          description: Sources that failed. The guest is still returned.
          items:
            $ref: "#/components/schemas/DegradedBody"
          type: array
        description:
          description: Description from the catalog.
          examples:
            - Blocky and dnsmasq
          type: string
        kind:
          description: Container or virtual machine.
          enum:
            - lxc
            - qemu
          examples:
            - lxc
          type: string
        managedByIac:
          description: Whether homelab-iac manages the guest. Absent when the catalog is unavailable.
          examples:
            - true
          type: boolean
        name:
          description: Guest name.
          examples:
            - dns
          type: string
        node:
          description: Proxmox node hosting the guest.
          examples:
            - pve
          type: string
        status:
          description: Proxmox status.
          examples:
            - running
          type: string
        upgrades:
          $ref: "#/components/schemas/UpgradesBody"
          description: Pending apt upgrades. Absent when the guest reports none.
        usage:
          $ref: "#/components/schemas/UsageBody"
          description: Resource usage. Absent unless the guest is running.
        vmid:
          description: Proxmox guest id.
          examples:
            - 116
          format: int64
          type: integer
      required:
        - degraded
        - vmid
        - name
        - kind
        - node
        - status
        - alertCount
      type: object
    ListAlertsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListAlertsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Alerts, most severe first, then most recent first. Resolved alerts come most recently ended first.
          items:
            $ref: "#/components/schemas/AlertBody"
          type: array
      required:
        - items
      type: object
    ListBackupJobsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListBackupJobsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Backup jobs by id.
          items:
            $ref: "#/components/schemas/BackupJobBody"
          type: array
      required:
        - items
      type: object
    ListBackupsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListBackupsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Backup status of the guests by VMID.
          items:
            $ref: "#/components/schemas/BackupBody"
          type: array
      required:
        - items
      type: object
    ListCertificatesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListCertificatesOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Certificates, the first to expire first.
          items:
            $ref: "#/components/schemas/CertificateBody"
          type: array
      required:
        - items
      type: object
    ListClientDomainsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListClientDomainsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: The most looked-up domains first.
          items:
            $ref: "#/components/schemas/DomainBody"
          type: array
      required:
        - items
      type: object
    ListClientsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListClientsOutputBody.json
          format: uri
          readOnly: true
          type: string
        degraded:
          description: Sources that failed. The clients are still listed, without their counts or names.
          items:
            $ref: "#/components/schemas/DegradedBody"
          type: array
        items:
          description: Devices that hold a DHCP lease.
          items:
            $ref: "#/components/schemas/ClientBody"
          type: array
      required:
        - items
        - degraded
      type: object
    ListDNSDomainsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListDNSDomainsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: The most looked-up domains first.
          items:
            $ref: "#/components/schemas/DomainBody"
          type: array
      required:
        - items
      type: object
    ListDisksOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListDisksOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Physical disks of the node by device.
          items:
            $ref: "#/components/schemas/DiskBody"
          type: array
      required:
        - items
      type: object
    ListDriftItemsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListDriftItemsOutputBody.json
          format: uri
          readOnly: true
          type: string
        degraded:
          description: Sources that failed. The other differences are still listed.
          items:
            $ref: "#/components/schemas/DegradedBody"
          type: array
        items:
          description: Differences between Proxmox and homelab-iac.
          items:
            $ref: "#/components/schemas/DriftItemBody"
          type: array
      required:
        - items
        - degraded
      type: object
    ListGuestsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ListGuestsOutputBody.json
          format: uri
          readOnly: true
          type: string
        degraded:
          description: Sources that failed. The guests are still listed.
          items:
            $ref: "#/components/schemas/DegradedBody"
