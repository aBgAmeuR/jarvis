            description: Only alerts of this severity.
            enum:
              - critical
              - warning
              - info
            type: string
        - description: Only alerts of this guest VMID.
          explode: false
          in: query
          name: guest
          schema:
            description: Only alerts of this guest VMID.
            examples:
              - "116"
