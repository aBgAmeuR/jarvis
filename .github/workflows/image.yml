name: image

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            apps/server/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@jarvis/web..." build

      # Same build as docker/Dockerfile, with the runner caches instead of a Docker build.
      - run: cp -r apps/web/dist/client/. apps/server/internal/platform/webui/static/
      - working-directory: apps/server
        run: |
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$RUNNER_TEMP/image/jarvis" ./cmd/jarvis-server
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
      - run: |
          docker build -f docker/Dockerfile.prebuilt -t jarvis:ci "$RUNNER_TEMP/image"
          docker save jarvis:ci -o "$RUNNER_TEMP/jarvis.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ inputs.version }}
          path: ${{ runner.temp }}/jarvis.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ inputs.version }}
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/jarvis.tar"
      - run: |
          echo ci > "$RUNNER_TEMP/token"
          chmod 644 "$RUNNER_TEMP/token"
          docker run -d --name jarvis -p 8080:8080 \
            -v "$RUNNER_TEMP/token:/run/secrets/proxmox_token:ro" \
            -e JARVIS_PROXMOX_URL=https://pve.invalid:8006 \
            -e JARVIS_PROXMOX_TOKEN_FILE=/run/secrets/proxmox_token \
            -e JARVIS_TRUSTED_PROXY=127.0.0.1 \
            jarvis:ci
          for _ in $(seq 20); do
            docker exec jarvis jarvis healthcheck && break
            sleep 1
          done
          docker exec jarvis jarvis healthcheck
          curl -fsS http://localhost:8080/ | grep -q "<title>Jarvis</title>"
          curl -fsS http://localhost:8080/guests/1 | grep -q "<title>Jarvis</title>"
      - if: failure()
        run: docker logs jarvis

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ inputs.version }}
          path: ${{ runner.temp }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/jarvis.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
