name: image

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: jarvis:ci
          outputs: type=docker,dest=${{ runner.temp }}/jarvis.tar
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ inputs.version }}
          path: ${{ runner.temp }}/jarvis.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ inputs.version }}
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/jarvis.tar"
      - run: |
          echo ci > "$RUNNER_TEMP/token"
          chmod 644 "$RUNNER_TEMP/token"
          docker run -d --name jarvis -p 8080:8080 \
            -v "$RUNNER_TEMP/token:/run/secrets/proxmox_token:ro" \
            -e JARVIS_PROXMOX_URL=https://pve.invalid:8006 \
            -e JARVIS_PROXMOX_TOKEN_FILE=/run/secrets/proxmox_token \
            -e JARVIS_TRUSTED_PROXY=127.0.0.1 \
            jarvis:ci
          for _ in $(seq 20); do
            docker exec jarvis jarvis healthcheck && break
            sleep 1
          done
          docker exec jarvis jarvis healthcheck
          curl -fsS http://localhost:8080/ | grep -q "<title>Jarvis</title>"
          curl -fsS http://localhost:8080/guests/1 | grep -q "<title>Jarvis</title>"
      - if: failure()
        run: docker logs jarvis

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ inputs.version }}
          path: ${{ runner.temp }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/jarvis.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
