name: image

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      version:
        type: string
        default: dev

env:
  IMAGE: ghcr.io/abgameur/jarvis

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: jarvis:ci
          outputs: type=docker,dest=${{ runner.temp }}/jarvis.tar
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/jarvis.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/jarvis.tar"
      - run: |
          echo ci > "$RUNNER_TEMP/token"
          chmod 644 "$RUNNER_TEMP/token"
          docker run -d --name jarvis -p 8080:8080 \
            -v "$RUNNER_TEMP/token:/run/secrets/proxmox_token:ro" \
            -e JARVIS_PROXMOX_URL=https://pve.invalid:8006 \
            -e JARVIS_PROXMOX_TOKEN_FILE=/run/secrets/proxmox_token \
            -e JARVIS_TRUSTED_PROXY=127.0.0.1 \
            jarvis:ci
          for _ in $(seq 20); do
            docker exec jarvis jarvis healthcheck && break
            sleep 1
          done
          docker exec jarvis jarvis healthcheck
          curl -fsS http://localhost:8080/ | grep -q "<title>Jarvis</title>"
          curl -fsS http://localhost:8080/guests/1 | grep -q "<title>Jarvis</title>"
      - if: failure()
        run: docker logs jarvis

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/jarvis.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    if: inputs.push
    needs: [test, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
      - id: digest
        run: |
          docker load -i "$RUNNER_TEMP/jarvis.tar"
          for ref in $TAGS; do
            docker tag jarvis:ci "$ref"
            docker push "$ref"
          done
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$(echo "$TAGS" | head -n1)")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  attest:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          format: spdx-json
          output: sbom.spdx.json

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true

      - run: |
          gh attestation verify "oci://$IMAGE@${{ needs.publish.outputs.digest }}" --repo "${{ github.repository }}"
          gh attestation verify "oci://$IMAGE@${{ needs.publish.outputs.digest }}" --repo "${{ github.repository }}" \
            --predicate-type https://spdx.dev/Document/v2.3
        env:
          GH_TOKEN: ${{ github.token }}
