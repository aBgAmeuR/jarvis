name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx semantic-release@25 -p @semantic-release/commit-analyzer,@semantic-release/release-notes-generator,@semantic-release/github
        env:
          GITHUB_TOKEN: ${{ github.token }}
