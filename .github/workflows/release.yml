name: release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 25
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  image:
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, image]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
